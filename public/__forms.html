<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>CUTTRU Forms</title></head>
  <body>
    <form name="project-review" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="project-review">
      <p hidden><label>Do not fill this out: <input name="bot-field"></label></p>
      <input name="name">
      <input name="email" type="email">
      <input name="project_type">
      <input name="project_stage">
      <input name="project_link" type="url">
      <textarea name="challenge"></textarea>
      <input name="diagnosis_score">
      <input name="diagnosis_focus">
      <input name="privacy_consent">
    </form>
  </body>
</html>
